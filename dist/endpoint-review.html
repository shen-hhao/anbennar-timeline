<h1>旧大陆 · 1819—1820端点审查</h1>
<p>本页逐项解释两端的归属或完整宗属链差异。1819 为分期推定，1820 为来源中的开局局势；二者之间的差异不等于变化发生在1820年。原住群体、地方行政、国家主权和地图位置分别判断。</p>
<p id="summary" role="status">正在读取审查结果…</p>
<p class="warning">涉及位置或来源冲突的省形，若已有前阶段归属，1820默认地图延续此前方案一年，彩色条纹可在图层中自行开启；这不确认整省主权或本年转属。此前已无国家显示的省份继续保留未明状态，不能解释为无人居住。原始州政治和旧投影保留供比较，不向更早年份倒填。</p>
